services:
  - type: web
    name: question-bank-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx384m -Xms128m -XX:+UseSerialGC"
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
